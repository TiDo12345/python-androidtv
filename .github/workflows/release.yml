# Build the sdist and wheel for a version tag (e.g. v0.0.75+tido.3) and attach them to a GitHub release.
# There is no PyPI upload; install a release with
#   pip install "androidtv[async] @ https://github.com/TiDo12345/python-androidtv/releases/download/<tag>/<wheel>"

name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:

    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # needed to create the release and upload the files
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: '3.13'
    - name: Check that the tag matches the package version
      env:
        TAG: ${{ github.ref_name }}
      run: |
        VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' androidtv/__init__.py)
        SETUP_VERSION=$(sed -n 's/^    version="\(.*\)",$/\1/p' setup.py)
        echo "tag: $TAG, androidtv/__init__.py: $VERSION, setup.py: $SETUP_VERSION"
        test "$TAG" = "v$VERSION"
        test "$VERSION" = "$SETUP_VERSION"
    - name: Build the sdist and wheel
      run: |
        python -m pip install --upgrade pip
        python -m pip install build twine
        python -m build
        python -m twine check --strict dist/*
        (cd dist && sha256sum * > SHA256SUMS)
        ls -l dist
    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --verify-tag \
          --notes "Built from $GITHUB_SHA. See README.rst for the changes compared to androidtv 0.0.75. SHA256 checksums are in SHA256SUMS."
