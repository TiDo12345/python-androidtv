# Weekly update suggestions for the GitHub Actions used in CI and for the Python requirements
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directories: ["/", "/docs"]
    schedule:
      interval: "weekly"
    # Pinned tools (venv_requirements.txt) are updated; the minimum versions in pyproject.toml only when needed
    versioning-strategy: increase-if-necessary
    groups:
      dev-tools:
        patterns: ["black", "build", "coverage", "coveralls", "flake8", "pylint", "pytest", "setuptools", "sphinx*", "twine"]
