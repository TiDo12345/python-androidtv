[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "androidtv"
dynamic = ["version"]
description = "Communicate with an Android TV or Fire TV device via ADB over a network."
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Irion", email = "jefflirion@users.noreply.github.com" }]
maintainers = [{ name = "TiDo12345" }]
keywords = ["adb", "android", "androidtv", "firetv"]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.11"
dependencies = ["adb-shell>=0.4.4", "pure-python-adb>=0.3.0.dev0"]

[project.optional-dependencies]
async = ["adb-shell[async]>=0.4.4", "aiofiles>=0.4.0"]
usb = ["adb-shell[usb]>=0.4.4"]

[project.urls]
Homepage = "https://github.com/TiDo12345/python-androidtv"
Issues = "https://github.com/TiDo12345/python-androidtv/issues"
Releases = "https://github.com/TiDo12345/python-androidtv/releases"
Upstream = "https://github.com/JeffLIrion/python-androidtv"
Documentation = "https://androidtv.readthedocs.io"

[tool.setuptools]
packages = ["androidtv", "androidtv.adb_manager", "androidtv.basetv", "androidtv.androidtv", "androidtv.firetv"]

[tool.setuptools.dynamic]
# The version is only defined in androidtv/__init__.py
version = { attr = "androidtv.__version__" }

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.coverage.run]
source = ["androidtv"]
